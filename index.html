<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>ESP8266 Temperature in Semkovo</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f3f4f6;
        margin: 0;
        padding: 30px;
        text-align: center;
      }

      h1 {
        margin-bottom: 30px;
      }

      .card {
        background: white;
        max-width: 700px;
        margin: 20px auto;
        padding: 25px;
        border-radius: 16px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      }

      #temperature {
        font-size: 60px;
        font-weight: bold;
        margin: 15px;
      }

      #updated {
        color: #777;
      }
    </style>
  </head>

  <body>
    <h1>🌡 ESP8266 Temperature in Semkovo</h1>

    <div class="card">
      <div>Текущая температура</div>

      <div id="temperature">-- °C</div>

      <div id="updated">Загрузка...</div>
    </div>

    <div class="card">
      <h2>Последние 24 часа</h2>

      <canvas id="temperatureChart"></canvas>
    </div>

    <script>
      const SUPABASE_URL = "https://iheghfpafkdoijqqefjm.supabase.co";

      const SUPABASE_KEY = "sb_publishable_MEQh7p1_dvIeRtUJnhkJfA_eN5SG8pc";

      let chart;

      // ================================
      // Загрузка данных
      // ================================

      async function loadTemperature() {
        const yesterday = new Date(
          Date.now() - 24 * 60 * 60 * 1000,
        ).toISOString();

        const url =
          SUPABASE_URL +
          "/rest/v1/measurements" +
          "?select=temperature,created_at" +
          "&created_at=gte." +
          yesterday +
          "&order=created_at.asc";

        try {
          const response = await fetch(url, {
            headers: {
              apikey: SUPABASE_KEY,
              Authorization: "Bearer " + SUPABASE_KEY,
            },
          });

          if (!response.ok) {
            throw new Error("HTTP error: " + response.status);
          }

          const data = await response.json();

          if (data.length === 0) {
            document.getElementById("temperature").textContent = "-- °C";

            document.getElementById("updated").textContent = "Нет данных";

            return;
          }

          // Последнее измерение

          const latest = data[data.length - 1];

          document.getElementById("temperature").textContent =
            Number(latest.temperature).toFixed(1) + " °C";

          const lastTime = new Date(latest.created_at);

          document.getElementById("updated").textContent =
            "Последнее измерение: " + lastTime.toLocaleString();

          // График

          const labels = data.map((row) =>
            new Date(row.created_at).toLocaleTimeString([], {
              hour: "2-digit",
              minute: "2-digit",
            }),
          );

          const temperatures = data.map((row) => row.temperature);

          drawChart(labels, temperatures);
        } catch (error) {
          console.error(error);

          document.getElementById("updated").textContent =
            "Ошибка загрузки данных";
        }
      }

      // ================================
      // Рисование графика
      // ================================

      function drawChart(labels, temperatures) {
        const ctx = document
          .getElementById("temperatureChart")
          .getContext("2d");

        if (chart) {
          chart.destroy();
        }

        chart = new Chart(ctx, {
          type: "line",

          data: {
            labels: labels,

            datasets: [
              {
                label: "Температура °C",

                data: temperatures,

                tension: 0.3,
              },
            ],
          },

          options: {
            responsive: true,

            scales: {
              y: {
                title: {
                  display: true,
                  text: "°C",
                },
              },
            },
          },
        });
      }

      // Загружаем сразу
      loadTemperature();

      // Обновляем каждые 60 секунд
      setInterval(loadTemperature, 60000);
    </script>
  </body>
</html>
